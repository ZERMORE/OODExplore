[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ood-explore"
version = "0.1.0"
description = "Visual-conditioned geometric uncertainty for Qwen2.5-VL"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2", "Pillow>=10", "matplotlib>=3.8", "torch>=2.5", "transformers==4.51.3", "accelerate>=1.2,<2", "datasets>=3.6,<4", "safetensors>=0.4.5", "tqdm>=4.66"]

[project.scripts]
ood-explore = "ood_explore.cli:main"

[tool.setuptools.packages.find]
include = ["ood_explore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
